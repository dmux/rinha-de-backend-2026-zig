services:
  proxy:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:latest
    container_name: proxy
    entrypoint: ["/zig-proxy"]
    volumes:
      - sockets:/sockets
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    cpu_period: 100000
    cpu_quota: 5000
    deploy:
      resources:
        limits:
          memory: 100M
    networks:
      - rinha-network

  api-1:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:latest
    container_name: api-1
    entrypoint: ["/fraud-api"]
    command: ["--index", "/data/ivf_index.bin", "--mcc-risk", "/resources/mcc_risk.json", "--port", "8080"]
    environment:
      - API_SOCKET=/sockets/api1.sock
      - THRESHOLD=0.6
      - NPROBE=15
    volumes:
      - sockets:/sockets
    cpu_period: 100000
    cpu_quota: 47500
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api1.sock", "http://localhost/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - rinha-network

  api-2:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:latest
    container_name: api-2
    entrypoint: ["/fraud-api"]
    command: ["--index", "/data/ivf_index.bin", "--mcc-risk", "/resources/mcc_risk.json", "--port", "8080"]
    environment:
      - API_SOCKET=/sockets/api2.sock
      - THRESHOLD=0.6
      - NPROBE=15
    volumes:
      - sockets:/sockets
    cpu_period: 100000
    cpu_quota: 47500
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api2.sock", "http://localhost/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - rinha-network

volumes:
  sockets:
    driver: local

networks:
  rinha-network:
    driver: bridge
