services:
  proxy:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:v3
    container_name: proxy
    entrypoint: ["/zig-proxy"]
    environment:
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
    volumes:
      - sockets:/sockets
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    networks:
      - rinha-network

  api-1:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:v3
    container_name: api-1
    entrypoint: ["/fraud-api"]
    environment:
      - API_SOCKET=/sockets/api1.sock
      - THRESHOLD=0.6
      - NPROBE=15
    volumes:
      - sockets:/sockets
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api1.sock", "http://localhost/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rinha-network

  api-2:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:v3
    container_name: api-2
    entrypoint: ["/fraud-api"]
    environment:
      - API_SOCKET=/sockets/api2.sock
      - THRESHOLD=0.6
      - NPROBE=15
    volumes:
      - sockets:/sockets
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api2.sock", "http://localhost/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rinha-network

volumes:
  sockets:
    driver: local

networks:
  rinha-network:
    driver: bridge
