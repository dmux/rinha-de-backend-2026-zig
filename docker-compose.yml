services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 50M
    networks:
      - rinha-network

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-1
    environment:
      - API_SOCKET=/sockets/api1.sock
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 150M
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api1.sock", "http://localhost/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 30s
    networks:
      - rinha-network

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-2
    environment:
      - API_SOCKET=/sockets/api2.sock
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 150M
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api2.sock", "http://localhost/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 30s
    networks:
      - rinha-network

volumes:
  sockets:
    driver: local

networks:
  rinha-network:
    driver: bridge
