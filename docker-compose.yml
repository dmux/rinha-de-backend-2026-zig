services:
  proxy:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:v6
    container_name: proxy
    entrypoint: ["/zig-proxy"]
    environment:
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
      - PORT=9999
    volumes:
      - sockets:/sockets
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpu_period: 10000
    cpu_quota: 1000 # 0.10 CPU
    deploy:
      resources:
        limits:
          memory: 30M
    networks:
      - rinha-network

  api-1:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:v6
    container_name: api-1
    entrypoint: ["/fraud-api"]
    command: ["--index", "/data/specialist_index.bin", "--mcc-risk", "/resources/mcc_risk.json", "--port", "8080"]
    environment:
      - API_SOCKET=/sockets/api1.sock
      - THRESHOLD=0.6
    volumes:
      - sockets:/sockets
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpu_period: 10000
    cpu_quota: 4500 # 0.45 CPU
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api1.sock", "http://localhost/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - rinha-network

  api-2:
    image: ghcr.io/dmux/rinha-de-backend-2026-zig:v6
    container_name: api-2
    entrypoint: ["/fraud-api"]
    command: ["--index", "/data/specialist_index.bin", "--mcc-risk", "/resources/mcc_risk.json", "--port", "8080"]
    environment:
      - API_SOCKET=/sockets/api2.sock
      - THRESHOLD=0.6
    volumes:
      - sockets:/sockets
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpu_period: 10000
    cpu_quota: 4500 # 0.45 CPU
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/sockets/api2.sock", "http://localhost/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - rinha-network

volumes:
  sockets:
    driver: local

networks:
  rinha-network:
    driver: bridge
