name: Build e Publica Imagem Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dmux/rinha-de-backend-2026-zig

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar references.json.gz da Rinha
        run: |
          curl -fsSL \
            "https://github.com/zanfranceschi/rinha-de-backend-2026/raw/main/resources/references.json.gz" \
            -o resources/references.json.gz

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
